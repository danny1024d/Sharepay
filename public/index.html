            <button type="button" class="w-full p-3 rounded-xl border-2 transition-colors flex items-center justify-between border-slate-200 bg-white">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-md text-sm font-semibold bg-amber-100 text-amber-600">n</span>
                <i data-lucide="arrow-right" class="w-4 h-4 text-slate-400"></i>
                <span class="px-2.5 py-1 rounded-md text-sm font-semibold bg-blue-100 text-blue-600">高</span>
              </div>
              <span class="text-xs text-slate-500">高 需支付n</span>
            </button>
          </div>
        </div>
      </div>

      <div class="dialog-footer">
        <button id="payment-delete-btn" class="btn-outline btn-flex text-rose-600 border-rose-200 hover:bg-rose-50 hidden">
          <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i>刪除
        </button>
        
        <div class="flex gap-2 flex-1 justify-end">
          <button class="btn-outline btn-flex" onclick="closeDialog('payment-dialog')">取消</button>
          <button class="btn-primary btn-flex" onclick="closeDialog('payment-dialog')">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Places Dialog -->
  <div class="dialog-overlay" id="place-dialog">
    <div class="dialog-content">
      <div class="dialog-header flex items-center justify-between">
        <h2 class="dialog-title" id="place-dialog-title">新增地點</h2>
        <button type="button" onclick="closeDialog('place-dialog')" class="p-1 text-slate-400 hover:text-slate-700" aria-label="關閉"><i data-lucide="x" class="h-5 w-5"></i></button>
      </div>
      <div class="space-y-4">
        <div id="place-name-display" class="hidden rounded-lg bg-slate-50 px-3 py-2.5">
          <p class="text-xs text-slate-500">地點（唯讀）</p>
          <p id="place-name-value" class="mt-0.5 break-words text-sm font-medium text-slate-900"></p>
        </div>
        <div id="place-ai-introduction-panel" class="hidden">
          <div id="place-ai-introduction-content"></div>
          <p id="place-ai-introduction-empty" class="hidden rounded-lg bg-slate-50 px-3 py-2 text-xs leading-5 text-slate-500">儲存時自動查詢繁體中文介紹。</p>
        </div>
      
        <div class="space-y-1.5">
          <label class="label" for="place-maps-link">Google Maps 分享連結 <span class="text-rose-600">必填</span></label>
          <input type="url" class="input-field" id="place-maps-link" placeholder="貼上 maps.app.goo.gl 或 Google Maps 網址" maxlength="2000" required />
          <p class="text-xs leading-5 text-slate-500">貼上連結，自動辨識名稱與座標。</p>
        </div>
        <div id="place-coordinates-field" class="hidden space-y-1.5">
          <label class="label" for="place-coordinates">經緯度（人工覆寫）</label>
          <input type="text" class="input-field" id="place-coordinates" placeholder="例：43.7706, 142.3650；留空則由 AI 重新定位" maxlength="500" />
          <p class="text-xs leading-5 text-slate-500">留空時會重新定位，搜尋範圍限北海道。</p>
          <div id="place-coordinate-sources" class="flex flex-wrap gap-x-3 gap-y-1 text-xs"></div>
        </div>
          <div class="space-y-2">
          <label class="label" for="place-tag-input">標籤</label>
          <div id="place-tags-selected" class="flex flex-wrap gap-1.5"></div>
          <div class="flex gap-2">
            <input type="text" class="input-field min-w-0 flex-1" id="place-tag-input" placeholder="輸入新標籤，例如：拉麵" maxlength="20" />
            <button type="button" id="place-tag-add" class="btn-outline btn-flex shrink-0">新增</button>
          </div>
          <div id="place-tags-existing" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div class="space-y-1.5">
          <label class="label" for="place-note">備註</label>
          <textarea class="textarea-field" id="place-note" rows="2" placeholder="例如：需預約、週一公休" maxlength="500"></textarea>
        </div>
      </div>
      <div class="dialog-footer">
        <button id="place-delete-btn" type="button" class="btn-outline btn-flex text-rose-600 border-rose-200 hover:bg-rose-50 hidden"><i data-lucide="trash-2" class="mr-1 h-4 w-4"></i>刪除</button>
        <div class="flex flex-1 justify-end gap-2">
          <button type="button" class="btn-outline btn-flex" onclick="closeDialog('place-dialog')">取消</button>
          <button type="button" class="btn-primary btn-flex">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Tab switching logic
    const navBtns = document.querySelectorAll('.nav-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    const headerSettlementSummary = document.getElementById('header-settlement-summary');
    const updateHeaderSettlementSummary = () => {
      const activeTab = document.querySelector('.nav-btn.text-indigo-600')?.dataset.tab;
      const shouldHide = ['places', 'settlement'].includes(activeTab) || window.scrollY > 8;
      if (headerSettlementSummary.classList.contains('hidden') !== shouldHide) {
        headerSettlementSummary.classList.toggle('hidden', shouldHide);
      }
    };
    let scrollUpdateScheduled = false;
    window.addEventListener('scroll', () => {
      if (scrollUpdateScheduled) return;
      scrollUpdateScheduled = true;
      requestAnimationFrame(() => {
        scrollUpdateScheduled = false;
        updateHeaderSettlementSummary();
      });
    }, { passive: true });

    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTab = btn.getAttribute('data-tab');
        // Reset all buttons
        navBtns.forEach(b => {
          b.classList.remove('text-indigo-600');
          b.classList.add('text-slate-400');
          const icon = b.querySelector('svg');
          icon.classList.remove('stroke-[2.5]');
          icon.classList.add('stroke-2');
        });

        // Set active button
        btn.classList.remove('text-slate-400');
        btn.classList.add('text-indigo-600');
        const activeIcon = btn.querySelector('svg');
        activeIcon.classList.remove('stroke-2');
        activeIcon.classList.add('stroke-[2.5]');

        // Show/hide content
        tabContents.forEach(content => {
          if (content.id === `tab-${targetTab}`) {
            content.classList.remove('hidden');
            content.classList.add('block');
          } else {
            content.classList.remove('block');
            content.classList.add('hidden');
          }
        });
        updateHeaderSettlementSummary();
      });
    });
    updateHeaderSettlementSummary();

    // Dialog logic
    function openExpenseDialog(isEdit) {
      document.getElementById('expense-dialog-title').innerText = isEdit ? '編輯支出' : '新增支出';
      const deleteBtn = document.getElementById('expense-delete-btn');
      if (isEdit) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }
      
      // Auto-set today if adding
      if (!isEdit) {
        document.getElementById('expense-date').value = new Date().toISOString().split('T')[0];
      }
      
      document.getElementById('expense-dialog').classList.add('open');
    }

    function openPaymentDialog(isEdit) {
      document.getElementById('payment-dialog-title').innerText = isEdit ? '編輯代付' : '新增代付';
      const deleteBtn = document.getElementById('payment-delete-btn');
      if (isEdit) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }
      
      if (!isEdit) {
        document.getElementById('payment-date').value = new Date().toISOString().split('T')[0];
      }
      
      document.getElementById('payment-dialog').classList.add('open');
    }

    function closeDialog(id) {
      document.getElementById(id).classList.remove('open');
    }
  </script>
  <script type="module" src="home.js"></script>
</body>
</html>
