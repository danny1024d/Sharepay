<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f7f2" />
  <meta name="description" content="選擇或建立旅遊行程。" />
  <title>我的行程 | 旅遊分帳</title>
  <link rel="stylesheet" href="trips.css" />
  <script type="module" src="trips.js"></script>
</head>
<body>
  <header class="trip-header">
    <div class="trip-header-inner">
      <div class="trip-heading-group">
        <div>
          <h1>我的行程</h1>
          <p>每一趟同行，都從這裡繼續。</p>
        </div>
      </div>
      <button id="logout-btn" class="icon-button" type="button" aria-label="登出" title="登出">
        <i data-lucide="log-out" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="trip-shell">
    <div class="trip-workspace">
      <section class="trip-list-section" aria-labelledby="trip-list-title">
        <div class="section-heading">
          <div>
            <h2 id="trip-list-title">選擇行程</h2>
            <p>最近使用的旅程會排在最前面</p>
          </div>
          <span id="trip-count" class="trip-count" aria-live="polite"></span>
        </div>
        <p id="trip-status" class="status-message" role="status" aria-live="polite">正在載入行程…</p>
        <div id="trip-list" class="trip-list"></div>
      </section>

      <section class="create-section" aria-labelledby="create-trip-title">
        <div class="create-heading">
          <div>
            <h2 id="create-trip-title">建立新行程</h2>
            <p>先替下一趟旅行留個位置。</p>
          </div>
        </div>
        <form id="create-trip-form" class="create-form">
          <div class="field-group">
            <label for="trip-name">行程名稱</label>
            <input id="trip-name" name="name" type="text" maxlength="60" required autocomplete="off" placeholder="例如：東京賞櫻" />
          </div>
          <div class="member-section">
            <div class="member-heading">
              <div>
                <span class="member-label">旅程成員</span>
                <p>從已授權的 Google 帳號選擇 2–10 人。</p>
              </div>
            </div>
            <div id="trip-member-accounts" class="member-account-list" aria-label="選擇旅程成員">
              <p class="member-loading">正在載入 Google 帳號…</p>
            </div>
          </div>
          <p id="create-error" class="form-error" role="alert"></p>
          <button id="create-trip-btn" class="primary-button" type="submit">
            <i data-lucide="plus" aria-hidden="true"></i>
            <span>建立行程</span>
          </button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
