<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 - 旅遊分帳</title>
  <meta name="description" content="登入旅遊分帳帳號。" />
  <link rel="stylesheet" href="./tailwind.generated.css" />
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <!-- AuthLayout -->
  <div class="min-h-screen flex items-center justify-center bg-background px-4">
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary mb-4">
          <i data-lucide="log-in" class="w-7 h-7 text-primary-foreground" aria-hidden="true"></i>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-foreground">旅遊分帳</h1>
        <p class="text-muted-foreground mt-2">使用已授權的 Google 帳號登入</p>
      </div>

      <!-- Card -->
      <div class="bg-card rounded-2xl shadow-sm border border-border p-8">
        <!-- Google button -->
        <button class="btn-outline mb-6" type="button" id="btn-google">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          使用 Google 帳號登入
        </button>

        <!-- Error (hidden by default) -->
        <div id="error-msg" class="mb-4 p-3 rounded-lg bg-destructive/10 text-destructive text-sm hidden"></div>
        <p class="text-center text-sm text-muted-foreground">僅限受邀帳號使用</p>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
