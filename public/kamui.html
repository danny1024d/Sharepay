<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="神居滑雪場雪道難度、纜車路線與官方營運資訊。" />
  <title>神居滑雪場 | 旅遊分帳</title>
  <link rel="stylesheet" href="itinerary.css" />
  <link rel="stylesheet" href="kamui.css?v=map-fullscreen-v2" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="module" src="kamui.js?v=kamui-vector-v9"></script>
</head>
<body class="kamui-fullscreen-page">
  <main class="kamui-screen" aria-label="神居滑雪場地圖">
    <div id="kamui-map" class="kamui-map" role="region" aria-label="神居滑雪場 Google 地圖"></div>

    <header class="kamui-topbar">
      <div class="kamui-topbar-title">
        <a class="kamui-back" href="itinerary.html" aria-label="回到北海道行程" title="回到北海道行程"><i data-lucide="arrow-left" aria-hidden="true"></i></a>
        <div>
          <h1>神居滑雪場</h1>
          <p>Kamui Ski Links・旭川</p>
        </div>
        <span class="kamui-season-status">纜車待官方確認</span>
      </div>
      <div class="kamui-map-controls" role="group" aria-label="地圖控制">
        <button class="map-control-button map-control-icon" id="kamui-current-location" type="button" title="定位到目前位置" aria-label="定位到目前位置"><i data-lucide="locate-fixed" aria-hidden="true"></i></button>
        <button class="map-control-button" id="kamui-locate" type="button" title="回到神居雪場" aria-label="回到神居雪場"><i data-lucide="mountain" aria-hidden="true"></i><span>回到雪場</span></button>
      </div>
    </header>

    <div class="kamui-map-status" aria-live="polite">
      <p id="kamui-map-status">正在載入神居滑雪場圖資…</p>
      <button class="kamui-retry hidden" id="kamui-map-retry" type="button">重試</button>
    </div>

    <div class="kamui-legend" aria-label="雪道難度圖例">
      <span><i class="legend-line easy"></i>初級</span>
      <span><i class="legend-line intermediate"></i>中級</span>
      <span><i class="legend-line advanced"></i>高級</span>
      <span><i class="legend-line lift"></i>纜車</span>
    </div>

    <a class="kamui-map-attribution" href="https://www.opensnowmap.org/" target="_blank" rel="noopener noreferrer">雪道圖 © OpenSnowMap · OpenStreetMap</a>

    <details class="kamui-info-drawer">
      <summary><i data-lucide="panel-bottom-open" aria-hidden="true"></i><span>纜車與雪場資訊</span><span class="kamui-drawer-status">營運待確認</span></summary>
      <div class="kamui-info-content">
        <div class="kamui-operations-heading">
          <div>
            <h2>纜車營運</h2>
            <p>此頁沒有雪場即時營運資料介面。</p>
          </div>
          <span class="kamui-unknown-pill">待官方確認</span>
        </div>
        <p class="kamui-operations-note">開放狀態與收班時間會依日期、天候及現場狀況變動；本頁不推測營運資訊。</p>
        <div class="kamui-info-links">
          <a class="kamui-official-link" href="https://www.kamui-skilinks.com/today/" target="_blank" rel="noopener noreferrer">官方本日營業內容<i data-lucide="external-link" aria-hidden="true"></i></a>
          <a class="kamui-map-link" href="https://www.kamui-skilinks.com/today/#coursemap" target="_blank" rel="noopener noreferrer">官方 Course Map</a>
        </div>
        <div class="kamui-lift-list-wrap">
          <h2>圖資中的纜車路線</h2>
          <ul id="kamui-lift-list" class="kamui-lift-list">
            <li class="kamui-empty">圖資載入後顯示纜車路線。</li>
          </ul>
        </div>
        <p class="kamui-disclaimer">本頁為旅程輔助資訊，與神居滑雪場無隸屬關係；雪況與路線請以現場公告為準。</p>
      </div>
    </details>
  </main>
</body>
</html>
